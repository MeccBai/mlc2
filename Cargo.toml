[package]
name = "mlc"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/syntax", "crates/core", "crates/codegen", "crates/builder"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mlc_syntax = { path = "crates/syntax" }
mlc_core = { path = "crates/core" }
mlc_codegen = { path = "crates/codegen" }
mlc_builder = { path = "crates/builder" }
logos = "0.16.1"
colored = "3.1.1"
chumsky = { version = "0.13", features = ["serde"] }
llvm-sys = { version = "231", features = ["no-llvm-linking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
blake3 = "1"
taskflowrs = { version = "=0.1.1", default-features = false }
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }

[dependencies]
mlc_syntax.workspace = true
mlc_core.workspace = true
mlc_codegen.workspace = true
mlc_builder.workspace = true
clap.workspace = true
tempfile.workspace = true
