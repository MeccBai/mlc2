[package]
name = "mlc"
version = "0.2.0"
edition = "2024"
default-run = "mlc"

[[bin]]
name = "mlc-build"
path = "src/builder_main.rs"

[[bin]]
name = "mlc-fmt"
path = "src/formatter_main.rs"

[[bin]]
name = "mlc-lsp"
path = "src/lsp_main.rs"

[workspace]
members = [
    ".",
    "crates/syntax",
    "crates/core",
    "crates/codegen",
    "crates/builder",
    "crates/examples",
    "crates/optimizer",
    "crates/formatter",
    "crates/ffi_parser",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
mlc_syntax = { path = "crates/syntax" }
mlc_core = { path = "crates/core" }
mlc_codegen = { path = "crates/codegen" }
mlc_builder = { path = "crates/builder" }
mlc_examples = { path = "crates/examples" }
mlc_optimizer = { path = "crates/optimizer" }
mlc_formatter = { path = "crates/formatter" }
ffi_parser = { path = "crates/ffi_parser" }
logos = "0.16.1"
colored = "3.1.1"
chumsky = { version = "0.13", features = ["serde"] }
llvm-sys = { version = "231", features = ["no-llvm-linking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
blake3 = "1"
taskflowrs = { version = "=0.1.1", default-features = false }
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
mlc_formatter.workspace = true
mlc_optimizer.workspace = true
mlc_syntax.workspace = true
mlc_core.workspace = true
mlc_codegen.workspace = true
mlc_builder.workspace = true
mlc_examples.workspace = true
toml.workspace = true
clap.workspace = true
tempfile.workspace = true
colored.workspace = true